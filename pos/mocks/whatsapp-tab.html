<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhatsApp tab mock</title>
<style>
/* Mock only. Colours copied from the POS's own tokens (pos/public/app.css). Data is invented. */
:root {
  --bg:#f3f4f2; --panel:#fff; --ink:#17201f; --quiet:#4d5b59; --line:#dde2e0; --rule:#e8ecea;
  --pri:#0f6e6e; --pri-tint:#e3f1f0; --on-pri:#fff;
  --go:#2f6b1f; --go-tint:#e8f2e2; --go-line:#a6cf96;
  --warn:#8a4b00; --warn-tint:#fbefdd; --warn-line:#e8c48f;
  --bad:#a52a1f; --bad-tint:#fbe9e6; --bad-line:#e6aaa3;
  --top:#0f4f4f; --top-ink:#eef6f5; --top-quiet:#b6d3d0; --soft:#f6f7f5; --mock:#fff7d6; --mock-line:#e3cf7a;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; color-scheme:light;
}
:root[data-theme="night"] {
  --bg:#0e1516; --panel:#141d1e; --ink:#e4ecec; --quiet:#a9b8b8; --line:#2b3c3d; --rule:#223031;
  --pri:#5cc6c0; --pri-tint:#173a39; --on-pri:#081010;
  --go:#7cc46a; --go-tint:#1a3018; --go-line:#3d6634;
  --warn:#f0b264; --warn-tint:#33260f; --warn-line:#6b4b1c;
  --bad:#f08a80; --bad-tint:#3a1714; --bad-line:#7a3a33;
  --top:#081010; --top-ink:#e6f0ef; --top-quiet:#8fa6a4; --soft:#1a2526; --mock:#2c2810; --mock-line:#6b5d22; color-scheme:dark;
}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--font)}
button{font:inherit;color:inherit;cursor:pointer}
.mockbar{background:var(--mock);border-bottom:1px solid var(--mock-line);padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:14px}
.mockbar b{margin-right:4px}
.seg{display:inline-flex;border:1px solid var(--mock-line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:4px 10px}.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.top{background:var(--top);color:var(--top-ink);padding:10px 16px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;font-size:15px}
.top b{font-size:17px}.top span{color:var(--top-quiet)}.top .on{color:var(--top-ink);text-decoration:underline;text-underline-offset:5px}
main{max-width:980px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:24px;margin:0} h2{font-size:18px;margin:0 0 4px} p{margin:0}
.quiet{color:var(--quiet)} .small{font-size:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 18px}
.tabs a{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:14px;color:var(--ink);text-decoration:none}
.tabs a.cur{background:var(--pri);border-color:var(--pri);color:var(--on-pri);font-weight:600}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.big{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.dot{width:14px;height:14px;border-radius:50%;margin-top:6px;flex:none}
.status{display:inline-block;font-size:13px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid}
.ok{color:var(--go);background:var(--go-tint);border-color:var(--go-line)}
.warn{color:var(--warn);background:var(--warn-tint);border-color:var(--warn-line)}
.bad{color:var(--bad);background:var(--bad-tint);border-color:var(--bad-line)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:14px}
.fact{background:var(--soft);border-radius:10px;padding:10px 12px}.fact .k{font-size:13px;color:var(--quiet)}.fact .v{font-weight:600}
.msg{border:1px solid;border-radius:10px;padding:10px 12px;margin-bottom:14px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--rule)}
.row:first-of-type{border-top:0}
.grow{flex:1 1 260px;min-width:0}
.name{font-weight:600}
.chip{display:inline-block;font-size:13px;padding:2px 8px;border-radius:999px;background:var(--pri-tint);color:var(--pri);margin:4px 6px 0 0}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 14px;font-weight:600}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.sw{display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:4px 0;font-weight:600}
.sw i{width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;flex:none}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.sw[aria-checked="true"] i{background:var(--go)}.sw[aria-checked="true"] i::after{left:21px}
.sw[disabled]{opacity:.55;cursor:not-allowed}
ol{margin:8px 0 0;padding-left:22px} li{margin:6px 0}
.never{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px 16px;margin-top:8px}
.ask{border:1px dashed var(--mock-line);background:var(--mock);border-radius:8px;padding:6px 10px;font-size:13px;margin-top:8px}
.form{background:var(--soft);border-radius:10px;padding:12px;margin-top:10px;width:100%}
.form label{display:block;margin:6px 0}
@media (max-width:560px){.top span{display:none}.top span.on{display:inline}}
</style>
</head>
<body>
<div class="mockbar" role="region" aria-label="Mock controls">
  <b>MOCK</b>
  <span>Signed in as <span class="seg" id="role"><button aria-pressed="true" data-v="owner">Owner</button><button aria-pressed="false" data-v="manager">Manager</button></span></span>
  <span>State <span class="seg" id="state"><button aria-pressed="true" data-v="on">Reading</button><button aria-pressed="false" data-v="off">PC off</button><button aria-pressed="false" data-v="none">Not set up</button></span></span>
  <span>Screen <span class="seg" id="theme"><button aria-pressed="true" data-v="day">Day</button><button aria-pressed="false" data-v="night">Night</button></span></span>
</div>
<div class="top"><b>XOXO Hostel</b><span>Tables</span><span>Rooms</span><span>Payments</span><span>Reports</span><span>Daily check</span><span class="on">Settings</span></div>
<main id="app"></main>
<script>
const S = { role: 'owner', state: 'on', groups: [
  { id: 1, name: 'Guest payment', proof: true, dept: 'Front desk', read: true, last: '10:42 am', today: 23 },
  { id: 2, name: 'Kitchen purchases', proof: false, dept: 'Kitchen', read: true, last: 'yesterday 6:15 pm', today: 0 },
  { id: 3, name: 'Bar stock', proof: false, dept: 'Bar', read: false, last: '24 Nov', today: 0 },
], seen: [{ name: 'XOXO staff', when: '2 min ago' }, { name: 'Housekeeping', when: '2 min ago' }], adding: null };
const tabs = ['Menu','Categories','Add-ons','Stations','Rooms and tables','Reasons','Billing names','UPI accounts','Rooms and bookings','WhatsApp','Staff and PINs','This device'];
const ownerOnly = ['Billing names','UPI accounts','Staff and PINs','This device'];
const sw = (on, act, id, label, dis) => `<button class="sw" role="switch" aria-checked="${on}" data-act="${act}" data-id="${id}" ${dis ? 'disabled' : ''}><i></i>${label}</button>`;

function render() {
  const owner = S.role === 'owner', st = S.state;
  const reading = S.groups.filter((g) => g.read);
  let h = `<h1>Settings</h1><p class="quiet small">Changes here reach every counter device at once.</p>
  <nav class="tabs">${tabs.filter((t) => owner || !ownerOnly.includes(t)).map((t) => `<a href="#" class="${t === 'WhatsApp' ? 'cur' : ''}">${t}</a>`).join('')}</nav>`;

  if (st === 'none') {
    h += `<section class="panel"><div class="big"><span class="dot" style="background:var(--quiet)"></span><div class="grow">
      <h2>WhatsApp reading is not set up yet</h2>
      <p class="quiet">When it is on, photos and PDF bills posted in the groups you choose (UPI screenshots, card slips, bill photos) come into Bookr by themselves. The Payments screen then shows each bill's proof.</p></div></div>
      <h2 style="margin-top:16px">What is needed, once</h2>
      <ol>
        <li><b>The reception PC</b> runs the small Bookr reading program, linked to the reception phone like WhatsApp Web (phone: WhatsApp › Linked devices › Link a device).</li>
        <li><b>A secret</b> the PC and Bookr share. It is set on the server only, never typed here.</li>
        <li><b>Come back here</b> and choose which groups to read.</li>
      </ol>
      <p class="small quiet" style="margin-top:8px">Steps 1 and 2 are done once by whoever sets up the PC. This page turns green within a minute of the PC starting.</p>
      <p style="margin-top:12px"><button class="btn">Show the PC set-up steps</button></p></section>`;
  } else {
    const off = st === 'off';
    h += `<section class="panel"><div class="big"><span class="dot" style="background:var(${off ? '--bad' : reading.length ? '--go' : '--warn'})"></span><div class="grow">
      <h2>${off ? 'Not reading: the reception PC is off' : reading.length ? `Reading ${reading.length} group${reading.length > 1 ? 's' : ''}` : 'Set up, but no group is turned on'}</h2>
      <p class="quiet">${off ? 'Nothing is lost. Photos posted while it is off come in when the PC is back on.' : 'New photos and PDF bills show in Bookr within a minute.'}</p></div>
      <span class="status ${off ? 'bad' : 'ok'}">${off ? 'Stopped' : 'Working'}</span></div>
      <div class="facts">
        <div class="fact"><div class="k">Reception PC</div><div class="v">${off ? 'Last heard 8:05 am' : 'Online · 1 min ago'}</div></div>
        <div class="fact"><div class="k">Newest photo</div><div class="v">${off ? '8:01 am' : '10:42 am'}</div></div>
        <div class="fact"><div class="k">Photos today</div><div class="v">${off ? 9 : 23}</div></div>
        <div class="fact"><div class="k">Bookr</div><div class="v">Connected</div></div>
      </div></section>`;
    if (off) h += `<div class="msg bad">Ask reception to switch on the PC and check it is online. If it stays off for about two weeks, WhatsApp unlinks it and the phone must link it again.</div>`;

    h += `<section class="panel"><h2>Groups read</h2><p class="quiet small">Turn a group off to stop reading it. Photos already in stay in Bookr.</p>`;
    for (const g of S.groups) h += `<div class="row"><div class="grow"><div class="name">${g.name}</div>
        <div class="small quiet">${g.read ? `Newest photo ${g.last} · ${g.today} today` : `Off since ${g.last}`}</div>
        <span class="chip">${g.dept}</span>${g.proof ? '<span class="chip">Payment proof at the counter</span>' : ''}</div>
        ${sw(g.proof, 'proof', g.id, 'Proof for bills', !g.read)}
        ${sw(g.read, 'read', g.id, g.read ? 'Reading' : 'Off')}</div>`;
    h += `<div class="ask">To decide: one switch per group (as here, no data change). A single "pause everything" switch would need one new setting in Bookr.</div></section>`;

    h += `<section class="panel"><h2>Other groups on the reception phone</h2><p class="quiet small">Seen by the PC, not read. Nothing from these is downloaded.</p>`;
    for (const [i, s] of S.seen.entries()) {
      h += `<div class="row"><div class="grow"><div class="name">${s.name}</div><div class="small quiet">Seen ${s.when}</div></div>
        <button class="btn ${owner ? 'pri' : ''}" data-act="add" data-id="${i}" ${owner ? '' : 'disabled'}>Start reading</button>
        ${owner ? '' : '<span class="small quiet">Owner only</span>'}</div>`;
      if (S.adding === i) h += `<div class="form"><b>Read "${s.name}"</b>
        <label>Department <select><option>Front desk</option><option>Kitchen</option><option>Bar</option><option>Housekeeping</option></select></label>
        <label><input type="checkbox"> Use its photos as payment proof for bills at the counter</label>
        <p class="small quiet">Photos and PDFs posted from now on will be stored in Bookr.</p>
        <p style="margin-top:8px"><button class="btn pri" data-act="save" data-id="${i}">Start reading</button> <button class="btn" data-act="cancel">Cancel</button></p></div>`;
    }
    h += `<div class="ask">To decide: may a manager also start reading a new group? Shown here as Owner only.</div></section>`;
  }

  h += `<section class="panel"><h2>What reading never does</h2><div class="never small">
    <span>✗ Send a message or reaction</span><span>✗ Show blue ticks (mark as read)</span><span>✗ Show "online" or "typing"</span>
    <span>✗ Read private chats</span><span>✗ Keep text or voice notes</span><span>✗ Change a group</span></div>
    <p class="small quiet" style="margin-top:10px">The only thing it ever sends is the morning Daily check to the owner, if turned on.</p></section>`;
  document.getElementById('app').innerHTML = h;
}
function seg(id, f) { const el = document.getElementById(id); el.addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return;
  el.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b)); f(b.dataset.v); render(); }); }
seg('role', (v) => { S.role = v; S.adding = null; }); seg('state', (v) => { S.state = v; });
seg('theme', (v) => { document.documentElement.dataset.theme = v === 'night' ? 'night' : ''; });
document.getElementById('app').addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return; e.preventDefault();
  const g = S.groups.find((x) => x.id == b.dataset.id);
  if (b.dataset.act === 'read') g.read = !g.read;
  if (b.dataset.act === 'proof') g.proof = !g.proof;
  if (b.dataset.act === 'add') S.adding = +b.dataset.id;
  if (b.dataset.act === 'cancel') S.adding = null;
  if (b.dataset.act === 'save') { const s = S.seen.splice(+b.dataset.id, 1)[0]; S.groups.push({ id: Date.now(), name: s.name, proof: false, dept: 'Front desk', read: true, last: 'just now', today: 0 }); S.adding = null; }
  render();
});
document.querySelector('.tabs')?.addEventListener('click', (e) => e.preventDefault());
render();
</script>
</body>
</html>
