<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhatsApp link mock</title>
<style>
/* Mock only. Colours are the POS's own tokens (pos/public/app.css). Data is invented; the QR picture is a made-up pattern, not a real code. */
:root {
  --bg:#f3f4f2; --panel:#fff; --ink:#17201f; --quiet:#4d5b59; --line:#dde2e0; --rule:#e8ecea; --field-line:#a3afac;
  --pri:#0f6e6e; --pri-tint:#e3f1f0; --on-pri:#fff;
  --go:#2f6b1f; --go-tint:#e8f2e2; --go-line:#a6cf96;
  --warn:#8a4b00; --warn-tint:#fbefdd; --warn-line:#e8c48f;
  --bad:#a52a1f; --bad-tint:#fbe9e6; --bad-line:#e6aaa3;
  --top:#0f4f4f; --top-ink:#eef6f5; --top-quiet:#b6d3d0; --soft:#f6f7f5; --mock:#fff7d6; --mock-line:#e3cf7a;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; color-scheme:light;
}
:root[data-theme="night"] {
  --bg:#0e1516; --panel:#141d1e; --ink:#e4ecec; --quiet:#a9b8b8; --line:#2b3c3d; --rule:#223031; --field-line:#557070;
  --pri:#5cc6c0; --pri-tint:#173a39; --on-pri:#081010;
  --go:#7cc46a; --go-tint:#1a3018; --go-line:#3d6634;
  --warn:#f0b264; --warn-tint:#33260f; --warn-line:#6b4b1c;
  --bad:#f08a80; --bad-tint:#3a1714; --bad-line:#7a3a33;
  --top:#081010; --top-ink:#e6f0ef; --top-quiet:#8fa6a4; --soft:#1a2526; --mock:#2c2810; --mock-line:#6b5d22; color-scheme:dark;
}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--font)}
button{font:inherit;color:inherit;cursor:pointer}
.mockbar{background:var(--mock);border-bottom:1px solid var(--mock-line);padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:14px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--mock-line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:4px 10px}.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.top{background:var(--top);color:var(--top-ink);padding:10px 16px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;font-size:15px}
.top b{font-size:17px}.top span{color:var(--top-quiet)}.top .on{color:var(--top-ink);text-decoration:underline;text-underline-offset:5px}
main{max-width:900px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:24px;margin:0} h2{font-size:18px;margin:0} h3{font-size:15px;margin:0} p{margin:0}
.quiet{color:var(--quiet)} .small{font-size:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 18px}
.tabs a{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:14px;color:var(--ink);text-decoration:none}
.tabs a.cur{background:var(--pri);border-color:var(--pri);color:var(--on-pri);font-weight:600}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.status{display:inline-block;font-size:13px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid}
.ok{color:var(--go);background:var(--go-tint);border-color:var(--go-line)}
.warn{color:var(--warn);background:var(--warn-tint);border-color:var(--warn-line)}
.bad{color:var(--bad);background:var(--bad-tint);border-color:var(--bad-line)}
.mute{color:var(--quiet);background:var(--soft);border-color:var(--line)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 14px;font-weight:600;min-height:44px}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.btn.danger{color:var(--bad);border-color:var(--bad-line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.phone{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:12px;background:var(--soft);border-radius:10px;padding:12px}
.phone .big{font-size:22px;font-weight:800;letter-spacing:.02em}
.qrwrap{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start;margin-top:14px}
.qr{background:#fff;padding:14px;border-radius:12px;border:1px solid var(--line);width:252px;max-width:100%}
.qr svg{display:block;width:100%;height:auto}
.steps{flex:1 1 260px;min-width:0}
.steps ol{margin:8px 0 0;padding-left:22px;line-height:1.7}
.bar{height:6px;background:var(--rule);border-radius:999px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--pri);transition:width 1s linear}
.spin{width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--pri);border-radius:50%;animation:s 1s linear infinite;flex:none}
@keyframes s{to{transform:rotate(360deg)}}
.msg{border:1px solid;border-radius:10px;padding:10px 12px;margin-bottom:14px}
.ask{border:1px dashed var(--mock-line);background:var(--mock);border-radius:8px;padding:6px 10px;font-size:13px;margin-top:10px}
.dim{opacity:.55}
@media (max-width:560px){.top span{display:none}.top span.on{display:inline}}
</style>
</head>
<body>
<div class="mockbar" role="region" aria-label="Mock controls">
  <b>MOCK</b>
  <span>Signed in as <span class="seg" id="role"><button aria-pressed="true" data-v="owner">Owner</button><button aria-pressed="false" data-v="manager">Manager</button></span></span>
  <span>Step <span class="seg" id="step">
    <button aria-pressed="true" data-v="linked">Linked</button><button aria-pressed="false" data-v="asking">Waiting for PC</button>
    <button aria-pressed="false" data-v="qr">QR shown</button><button aria-pressed="false" data-v="done">Just linked</button>
    <button aria-pressed="false" data-v="none">No number</button><button aria-pressed="false" data-v="pcoff">PC off</button></span></span>
  <span>Screen <span class="seg" id="theme"><button aria-pressed="true" data-v="day">Day</button><button aria-pressed="false" data-v="night">Night</button></span></span>
</div>
<div class="top"><b>XOXO Hostel</b><span>Tables</span><span>Rooms</span><span>Payments</span><span>Reports</span><span>Daily check</span><span class="on">Settings</span></div>
<main id="app"></main>
<script>
const S = { role: 'owner', step: 'linked', left: 20, switching: false };
const tabs = ['Menu','Categories','Add-ons','Stations','Rooms and tables','Reasons','Billing names','UPI accounts','Rooms and bookings','WhatsApp','Staff and PINs','This device'];
const ownerOnly = ['Billing names','UPI accounts','Staff and PINs','This device'];

// A made-up pattern that looks like a QR code (not a real one).
function fakeQr(seed) {
  const n = 29, c = 8; let r = seed * 9301 + 49297; const rnd = () => (r = (r * 9301 + 49297) % 233280) / 233280;
  let s = `<svg viewBox="0 0 ${n * c} ${n * c}" role="img" aria-label="QR code to scan with the phone"><rect width="100%" height="100%" fill="#fff"/>`;
  const finder = (x, y) => `<rect x="${x*c}" y="${y*c}" width="${7*c}" height="${7*c}" fill="#000"/><rect x="${(x+1)*c}" y="${(y+1)*c}" width="${5*c}" height="${5*c}" fill="#fff"/><rect x="${(x+2)*c}" y="${(y+2)*c}" width="${3*c}" height="${3*c}" fill="#000"/>`;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const inF = (x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9);
    if (!inF && rnd() > .52) s += `<rect x="${x*c}" y="${y*c}" width="${c}" height="${c}" fill="#000"/>`;
  }
  return s + finder(0, 0) + finder(n - 7, 0) + finder(0, n - 7) + '</svg>';
}

const statusPanel = (off) => `<section class="panel"><div class="between"><h2>${off ? 'Not reading: the reception PC is off' : 'Reading 2 groups'}</h2>
  <span class="status ${off ? 'bad' : 'ok'}">${off ? 'Stopped' : 'Working'}</span></div>
  <p class="quiet small" style="margin-top:4px">Reception PC ${off ? 'last heard 8:05 am' : 'online · 1 min ago'} · newest photo 10:42 am · 23 photos today</p></section>`;

function linkPanel() {
  const owner = S.role === 'owner', st = S.step;
  let h = `<section class="panel"><div class="between"><h2>WhatsApp number</h2>`;
  if (st === 'linked' || st === 'done') {
    h += `<span class="status ok">Linked</span></div>
      ${st === 'done' ? '<div class="msg ok" style="margin:12px 0 0">Linked. Reading starts within a minute. You can close this page.</div>' : ''}
      <div class="phone"><div><div class="small quiet">The reception PC reads WhatsApp as</div><div class="big">Phone ending 4321</div>
        <div class="small quiet">Linked 27 Nov, 6:40 pm by the Owner</div></div></div>`;
    if (owner) h += `<div class="row"><button class="btn" data-act="switch">Switch to another number</button><button class="btn danger" data-act="unlink">Unlink</button></div>
      <p class="small quiet" style="margin-top:8px">Unlink stops all reading. The phone also shows the PC under WhatsApp › Linked devices, where it can be removed too.</p>`;
    else h += `<p class="small quiet" style="margin-top:10px">Only the Owner can link, switch or unlink the number.</p>`;
  } else if (st === 'none') {
    h += `<span class="status mute">No number</span></div>
      <p class="quiet" style="margin-top:8px">The reception PC is on, but no WhatsApp number is linked, so nothing is read.</p>`;
    h += owner ? `<div class="row"><button class="btn pri" data-act="link">Link a WhatsApp number</button></div>` : `<p class="small quiet" style="margin-top:10px">Ask the Owner to link the reception number.</p>`;
  } else if (st === 'pcoff') {
    h += `<span class="status ok">Linked</span></div>
      <div class="phone"><div><div class="small quiet">The reception PC reads WhatsApp as</div><div class="big">Phone ending 4321</div></div></div>
      ${owner ? `<div class="row"><button class="btn dim" disabled>Switch to another number</button><button class="btn danger dim" disabled>Unlink</button></div>
      <p class="small quiet" style="margin-top:8px">The reception PC is off, so the number cannot be changed from here now. Switch the PC on first.</p>` : ''}`;
  } else if (st === 'asking') {
    h += `<span class="status warn">Linking</span></div>
      <div class="row"><span class="spin" aria-hidden="true"></span><span>Asking the reception PC for a code${S.switching ? ' (it stops reading phone ending 4321 first)' : ''}. This takes up to a minute.</span></div>
      <div class="row"><button class="btn" data-act="cancel">Cancel</button></div>`;
  } else if (st === 'qr') {
    h += `<span class="status warn">Scan now</span></div>
      <div class="qrwrap"><div class="qr">${fakeQr(S.left < 10 ? 7 : 3)}<div class="bar" aria-hidden="true"><i style="width:${S.left * 5}%"></i></div>
        <p class="small quiet" style="margin-top:6px;color:#4d5b59">New code in ${S.left} s</p></div>
        <div class="steps"><h3>On the phone to link (the reception phone)</h3><ol>
          <li>Open WhatsApp</li><li>Tap <b>Settings</b> (iPhone) or <b>⋮</b> (Android)</li><li>Tap <b>Linked devices</b> › <b>Link a device</b></li>
          <li>Point the phone at this code</li></ol>
          <p class="small quiet" style="margin-top:8px">The code changes on its own every 20 seconds. Stopped after 3 minutes if nobody scans; press Link again then.</p>
          <div class="row"><button class="btn" data-act="cancel">Cancel</button></div></div></div>`;
  }
  return h + `<div class="ask">To decide: is "Owner only" right for link, switch and unlink? (Managers see the number only.)</div></section>`;
}

function render() {
  const owner = S.role === 'owner';
  let h = `<h1>Settings</h1><p class="quiet small">Changes here reach every counter device at once.</p>
  <nav class="tabs">${tabs.filter((t) => owner || !ownerOnly.includes(t)).map((t) => `<a href="#" class="${t === 'WhatsApp' ? 'cur' : ''}">${t}</a>`).join('')}</nav>`;
  h += statusPanel(S.step === 'pcoff') + linkPanel();
  h += `<section class="panel dim"><h2>Groups read</h2><p class="quiet small">… as today (Guest payment, Kitchen purchases, Bar stock) …</p></section>`;
  document.getElementById('app').innerHTML = h;
}
function setStep(v) { S.step = v; document.querySelectorAll('#step button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.v === v)); render(); }
function seg(id, f) { const el = document.getElementById(id); el.addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return;
  el.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b)); f(b.dataset.v); render(); }); }
seg('role', (v) => { S.role = v; }); seg('step', (v) => { S.step = v; S.left = 20; });
seg('theme', (v) => { document.documentElement.dataset.theme = v === 'night' ? 'night' : ''; });
let t1;
document.getElementById('app').addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return; e.preventDefault(); clearTimeout(t1);
  const a = b.dataset.act;
  if (a === 'link' || a === 'switch') { S.switching = a === 'switch'; setStep('asking'); t1 = setTimeout(() => { S.left = 20; setStep('qr'); }, 2500); }
  if (a === 'unlink' && confirm('Unlink phone ending 4321? The reception PC stops reading WhatsApp until a number is linked again.')) setStep('none');
  if (a === 'cancel') setStep(S.switching ? 'linked' : 'none');
});
setInterval(() => { if (S.step === 'qr') { S.left = S.left <= 1 ? 20 : S.left - 1; render(); } }, 1000);
render();
</script>
</body>
</html>
