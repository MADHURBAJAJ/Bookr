<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookr: offline</title>
<meta name="theme-color" content="#14202B">
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #F4F6F8; color: #14202B;
    font-family: system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
  .card { background: #fff; border: 1px solid #DDE3E9; border-radius: 12px; padding: 24px; max-width: 360px; text-align: center; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: #4B5B6B; font-size: 15px; line-height: 1.5; margin: 0 0 16px; }
  a { display: inline-block; background: #0F766E; color: #fff; text-decoration: none; padding: 12px 20px; border-radius: 8px; font-weight: 500; }
</style>
</head>
<body>
<div class="card">
  <h1>You're offline</h1>
  <p>Bookr needs the internet to show and save your book. Nothing is lost: connect and try again.</p>
  <a href="/">Try again</a>
</div>
</body>
</html>
